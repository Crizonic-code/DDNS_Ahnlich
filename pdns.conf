# PowerDNS Authoritative Server Configuration for DDNS_Ahnlich

launch=gsqlite3
gsqlite3-database=/var/lib/powerdns/pdns.db

api=yes
api-key=${PDNS_API_KEY:-ddns-secret-api-key-change-me}
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081

allow-axfr-ips=127.0.0.1, ::1
local-port=53
local-address=0.0.0.0

# Logging
loglevel=3
dnsupdate=yes
